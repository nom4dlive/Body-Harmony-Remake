<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Resiliência do Player LMS HLS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #051A29;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 2rem;
        }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        button {
            background: #ED7E13;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #f59a2e;
        }
        #log {
            text-align: left;
            background: #000;
            color: #00ff00;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste de Resiliência do Player HLS (PLAN-033/PLAN-034)</h1>
        <video id="video" controls muted></video>
        
        <div class="btn-group">
            <button id="btn-media-error">Injetar Erro de Mídia Fatal</button>
            <button id="btn-network-error">Injetar Erro de Rede Fatal</button>
        </div>
        
        <h3>Log de Eventos do Player:</h3>
        <div id="log">Inicializando player de teste...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const logDiv = document.getElementById('log');
        const btnMediaError = document.getElementById('btn-media-error');
        const btnNetworkError = document.getElementById('btn-network-error');

        function log(msg) {
            logDiv.innerHTML += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        // Simulação da URL assinada HLS e do fallback para stream.php
        const hlsUrl = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"; // Big Buck Bunny HLS Test Stream
        const fallbackUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"; // MP4 Test Stream (stream.php mock)

        let hls = null;
        let hlsRetryCount = 0;
        let mediaRetryCount = 0;

        function fallbackToStream() {
            log("🛑 [FALLBACK] HLS falhou consecutivamente! Chaveando para streaming progressivo (stream.php)...");
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.src = fallbackUrl;
            video.play().then(() => {
                log("🟢 [FALLBACK] Vídeo progressivo iniciado com sucesso!");
                document.body.style.border = "4px solid #00ff00"; // Sinal visual de sucesso
            }).catch(e => {
                log("🔴 [FALLBACK] Erro ao iniciar vídeo progressivo: " + e.message);
            });
        }

        function initPlayer() {
            hlsRetryCount = 0;
            mediaRetryCount = 0;

            if (Hls.isSupported()) {
                log("Hls.js suportado. Instanciando com configurações otimizadas (PLAN-033)...");
                hls = new Hls({
                    maxBufferLength: 30, // 30s de buffer
                    maxMaxBufferLength: 60, // 60s max
                    enableWorker: true
                });

                hls.loadSource(hlsUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    log("🟢 Manifesto HLS carregado com sucesso. Buffer dimensionado.");
                    video.play().catch(() => log("Aguardando interação para reproduzir..."));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                if (hlsRetryCount >= 3) {
                                    log("🔴 Erro de rede fatal repetido 3 vezes!");
                                    fallbackToStream();
                                } else {
                                    hlsRetryCount++;
                                    log(`⚠️ Erro de rede fatal (Tentativa ${hlsRetryCount}/3). Executando startLoad()...`);
                                    hls.startLoad();
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                if (mediaRetryCount >= 3) {
                                    log("🔴 Erro de mídia fatal repetido 3 vezes!");
                                    fallbackToStream();
                                } else {
                                    mediaRetryCount++;
                                    log(`⚠️ Erro de mídia fatal (Tentativa ${mediaRetryCount}/3). Executando recoverMediaError()...`);
                                    hls.recoverMediaError();
                                }
                                break;
                            default:
                                log("🔴 Erro fatal desconhecido!");
                                fallbackToStream();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                log("Safari nativo HLS detectado.");
                video.src = hlsUrl;
                video.addEventListener('error', () => {
                    log("🔴 Erro no player nativo Safari.");
                    fallbackToStream();
                });
            }
        }

        // Configuração dos botões para injetar erros fatais na instância ativa
        btnMediaError.addEventListener('click', () => {
            if (hls) {
                log("Injetando MEDIA_ERROR fatal...");
                hls.trigger(Hls.Events.ERROR, {
                    type: Hls.ErrorTypes.MEDIA_ERROR,
                    details: 'manifestIncompatibleCodecsError',
                    fatal: true
                });
            } else {
                log("Player HLS não ativo.");
            }
        });

        btnNetworkError.addEventListener('click', () => {
            if (hls) {
                log("Injetando NETWORK_ERROR fatal...");
                hls.trigger(Hls.Events.ERROR, {
                    type: Hls.ErrorTypes.NETWORK_ERROR,
                    details: 'levelLoadError',
                    fatal: true
                });
            } else {
                log("Player HLS não ativo.");
            }
        });

        initPlayer();
    </script>
</body>
</html>
