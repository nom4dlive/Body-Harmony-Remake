server {
    server_name crm.bodyharmony.com.br;
    underscores_in_headers on;

    client_max_body_size 100M;
    proxy_read_timeout 300s;

    # Silenciar rota enterprise limits no Chatwoot Community Edition
    location /enterprise/api/v1/accounts/ {
        return 200 '{"data":{}}';
        add_header Content-Type application/json;
    }

    # White-Label Custom Theme CSS
    location = /custom-bh-crm.css {
        root /opt/crm;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # White-Label Custom Tools JS
    location = /custom-bh-crm.js {
        root /opt/crm;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # White-Label Brand Assets
    location /brand-assets/ {
        alias /opt/crm/brand-assets/;
        access_log off;
    }

    # Favicon e Ícones White-Label
    location ~* ^/(favicon.*|apple-icon.*|android-icon.*|ms-icon.*)\.(png|ico|svg)$ {
        alias /opt/crm/brand-assets/favicon.svg;
        add_header Content-Type image/svg+xml;
        access_log off;
    }

    # 1. Redirecionamento Unificado para o CRM V4 Oficial (PLAN-224)
    location / {
        return 302 https://bodyharmony.com.br/portal-gestor/crm;
    }


    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm.bodyharmony.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.bodyharmony.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name evolution.bodyharmony.com.br;

    client_max_body_size 100M;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port 443;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm.bodyharmony.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.bodyharmony.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name crm.bodyharmony.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name evolution.bodyharmony.com.br;
    return 301 https://$host$request_uri;
}
