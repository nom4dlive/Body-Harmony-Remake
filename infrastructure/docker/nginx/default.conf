server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.html index.php;

    client_max_body_size 64M;

    # Anti-Cache for index.html (STABILITY FIX)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Security: Block access to .env files
    location ~ /\.env {
        deny all;
    }

    # SPA Frontend Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API V1 Rewrite
    location /api/v1/ {
        try_files $uri $uri/ /api/v1/index.php?$query_string;
    }

    # API Root Proxy (Nexus V3.1 Compatibility)
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Secure Video Streaming via X-Accel-Redirect (Direct high-performance sendfile)
    location /private_internal_lessons/ {
        internal;
        alias /var/www/private_uploads/lessons/;
        
        # Performance settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        # Buffering tuning
        aio on;
        directio 512k;
        output_buffers 1 128k;
    }

    # Media Fallback Proxy: Serve uploads locally if they exist, otherwise pull from Hostinger Premium
    location /uploads/ {
        try_files $uri @fallback_premium;
    }

    location @fallback_premium {
        proxy_pass https://bodyharmony.com.br;
        proxy_set_header Host bodyharmony.com.br;
        proxy_ssl_server_name on;
        proxy_cache_bypass $http_upgrade;
    }

    # PHP FastCGI Routing
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }
}
